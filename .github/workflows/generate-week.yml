name: Generate next week's content

# Claude Code writes the next week of carousels and commits them. The publish
# workflow (05:15 UTC) then renders and schedules whatever is unscheduled, so
# the two are each other's safety net.

on:
  workflow_dispatch:
    inputs:
      week:
        description: 'Week folder to create (blank = next unused, e.g. week2)'
        required: false
      notes:
        description: 'Optional steer for this batch, e.g. "lean into debt stories"'
        required: false

  schedule:
    - cron: '30 3 * * 0'   # Sunday 03:30 UTC = 05:30 SAST, before publish

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Decide which week to write
        id: cfg
        run: |
          WEEK="${{ github.event.inputs.week }}"
          if [ -z "$WEEK" ]; then
            N=$(ls -1d content/week* 2>/dev/null | sed 's/.*week//' | sort -n | tail -1)
            N=${N:-0}
            WEEK="week$((N + 1))"
          fi
          if [ -d "content/$WEEK" ]; then
            echo "content/$WEEK already exists — nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          echo "Writing content/$WEEK"

      # The planner decides what every day of the week is about, so a broken
      # planner must not get to write one. This is the one analytics step that
      # SHOULD fail the job: it makes no network calls and needs no secrets.
      - name: Test the planner
        if: steps.cfg.outputs.skip != 'true'
        run: python3 scripts/test_performance.py

      - name: Plan the topic mix
        id: plan
        if: steps.cfg.outputs.skip != 'true'
        continue-on-error: true
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          AZURE_ACCOUNT: ${{ secrets.AZURE_ACCOUNT }}
          AZURE_TABLE_SAS: ${{ secrets.AZURE_TABLE_SAS }}
        run: |
          python3 scripts/performance.py --ingest --show || true
          PLAN=$(python3 scripts/performance.py --plan) || PLAN=""
          # main() wraps every branch and falls back to the playbook prior, so
          # this should now be unreachable. It stays because the alternative —
          # an empty string interpolated after "the assignment is measured, not
          # a suggestion:" — leaves the prompt dangling into nothing.
          if [ -z "$PLAN" ]; then
            echo "planner produced no assignment — telling Claude to choose" >&2
            PLAN="(no measured assignment is available this run — choose the wells yourself from scripts/wells.py and vary them across the seven days)"
          fi
          {
            echo 'assignment<<PLAN_EOF'
            printf '%s\n' "$PLAN"
            echo PLAN_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Write the week with Claude Code
        if: steps.cfg.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Without this the action swaps its OIDC token for a Claude Code
          # GitHub App token, which 401s unless the app is installed on the
          # repo. This job only writes files and commits, so the runner's own
          # token is enough and there is nothing to install.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--allowedTools "Skill,Read,Write,Edit,Glob,Grep,Bash(python3 *),Bash(ls *),Bash(cat *),Bash(curl *)"'
          prompt: |
            Write the next week of Beyond Horizon carousels into
            content/${{ steps.cfg.outputs.week }}/ as seven files named
            01_mon.json through 07_sun.json.

            Read CLAUDE.md first — it has the format, the hard rules and the
            gotchas. Then use the beyond-horizon-carousels skill — and read
            .claude/skills/beyond-horizon-carousels/SKILL.md plus both files in
            its references/ folder directly, so the guidance is loaded whether or
            not skill discovery fires. Use content/week1/ as a worked example of
            the exact JSON shape.

            Before writing, read every existing content/week*/*.json and list the
            personas, cities and income levels already used. Do
            not repeat any of them. Vary income level and life stage
            deliberately across the seven days, and skew below R40 000 —
            lower incomes perform materially better in this niche.

            Each day has an assigned content well. Write that day's post in that
            well and no other — the assignment is measured, not a suggestion:

            ${{ steps.plan.outputs.assignment }}

            The ten valid well slugs are the source of truth in
            scripts/wells.py; what each well means editorially is in
            .claude/skills/beyond-horizon-carousels/references/format-playbook.md.
            Set the matching "well" value in each spec's JSON. Four days share a
            well and two share another, so vary persona, city, income and hook
            hard within them — same topic must not mean same post.

            The single most important rule: for each post the "line" slide
            amounts must sum EXACTLY to income minus the reckoning amount.
            Verify with python3, not mentally.

            When all seven are written, run:
              python3 scripts/validate.py content/${{ steps.cfg.outputs.week }}
            and fix anything it reports until it passes with zero problems. Do
            not stop until it passes. Do not commit — a later step does that.

            ${{ github.event.inputs.notes }}

      - name: Validate before committing
        if: steps.cfg.outputs.skip != 'true'
        run: python3 scripts/validate.py "content/${{ steps.cfg.outputs.week }}"

      # validate.py only checks that `well` is A known slug, never that it is
      # THE assigned one, so drift would silently revert the whole feature to
      # the old behaviour with every run still green. Warn loudly, never fail:
      # content that exists beats content that doesn't. The table has not
      # changed since the plan step, so re-running --plan reproduces it.
      - name: Check the week honoured the plan
        if: steps.cfg.outputs.skip != 'true'
        continue-on-error: true
        env:
          AZURE_ACCOUNT: ${{ secrets.AZURE_ACCOUNT }}
          AZURE_TABLE_SAS: ${{ secrets.AZURE_TABLE_SAS }}
        run: |
          python3 scripts/performance.py --plan > /tmp/plan.txt || true
          python3 - "content/${{ steps.cfg.outputs.week }}" /tmp/plan.txt <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, sys
          week_dir, plan_path = sys.argv[1], sys.argv[2]
          plan = dict(line.strip().split("=", 1)
                      for line in open(plan_path) if "=" in line)
          rows = []
          for day, want in sorted(plan.items()):
              path = os.path.join(week_dir, f"{day}.json")
              try:
                  got = json.load(open(path)).get("well")
              except Exception as e:
                  got = f"unreadable: {e}"
              rows.append((day, want, got))
          bad = [r for r in rows if r[1] != r[2]]
          if not plan:
              print("### Plan adherence: no plan to compare against\n")
          elif bad:
              print(f"### Plan adherence: {len(bad)} of {len(rows)} days IGNORED "
                    "their assigned well\n")
              print("| Day | Assigned | Written |")
              print("|---|---|---|")
              for day, want, got in bad:
                  print(f"| `{day}` | `{want}` | `{got}` |")
              print("\nThe week was still committed. Check that "
                    "`.claude/skills/beyond-horizon-carousels/SKILL.md` and the "
                    "workflow prompt still agree that a supplied assignment wins.")
          else:
              print(f"### Plan adherence: all {len(rows)} days match their "
                    "assigned well\n")
          PY
          exit 0

      - name: Commit the week
        if: steps.cfg.outputs.skip != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "content/${{ steps.cfg.outputs.week }}"
          git diff --cached --quiet && { echo "nothing written"; exit 1; }
          git commit -m "Write content/${{ steps.cfg.outputs.week }}"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summary
        if: steps.cfg.outputs.skip != 'true'
        run: |
          python3 - "content/${{ steps.cfg.outputs.week }}" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import glob, json, os, sys
          d = sys.argv[1]
          print(f"### Wrote {d}\n")
          print("| File | Well | Net income | Hook |")
          print("|---|---|---|---|")
          for f in sorted(glob.glob(os.path.join(d, "[0-9]*.json"))):
              s = json.load(open(f))
              hook = next(x for x in s["slides"] if x.get("kind") == "hook")["title"]
              inc = f"R{s['income']:,}".replace(",", " ")
              well = s.get("well") or "—"
              print(f"| `{os.path.basename(f)}` | `{well}` | {inc} | {hook.replace(chr(10), ' ')} |")
          PY
