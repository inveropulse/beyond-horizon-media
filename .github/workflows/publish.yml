name: Render and schedule a content week

# Runs on GitHub's runners, which have unrestricted network access. The Cowork
# sandbox blocks every object store, CDN and the Buffer API, so upload and
# scheduling cannot happen there.

on:
  workflow_dispatch:
    inputs:
      week:
        description: 'Content folder under content/ (e.g. week1)'
        required: true
        default: 'week1'
      start:
        description: 'Monday of the posting week, YYYY-MM-DD'
        required: true
      dry_run:
        description: 'Validate and render only — schedule nothing'
        type: boolean
        default: false
      force:
        description: 'Re-schedule a week that already has a receipt'
        type: boolean
        default: false

  schedule:
    # Sundays 05:15 UTC = 07:15 SAST. Publishes the earliest unscheduled week.
    - cron: '15 5 * * 0'

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: renderer/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve week and start date
        id: cfg
        run: |
          WEEK="${{ github.event.inputs.week }}"
          START="${{ github.event.inputs.start }}"
          if [ -z "$WEEK" ]; then
            WEEK=$(ls -1 content | sort -V | while read w; do
              [ -f "content/$w/SCHEDULED.json" ] || { echo "$w"; break; }; done)
          fi
          if [ -z "$WEEK" ]; then
            echo "nothing unscheduled to publish"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          [ -n "$START" ] || START=$(date -u -d 'next monday' +%F)
          echo "week=$WEEK"   >> "$GITHUB_OUTPUT"
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "Publishing $WEEK starting $START"

      - name: Validate specs
        if: steps.cfg.outputs.skip != 'true'
        run: python3 scripts/validate.py "content/${{ steps.cfg.outputs.week }}"

      - name: Install renderer
        if: steps.cfg.outputs.skip != 'true'
        working-directory: renderer
        run: npm ci || npm install

      - name: Ensure a headless browser
        if: steps.cfg.outputs.skip != 'true'
        working-directory: renderer
        run: npx remotion browser ensure

      - name: Render carousels
        if: steps.cfg.outputs.skip != 'true'
        working-directory: renderer
        run: node render-carousels.mjs "../content/${{ steps.cfg.outputs.week }}" "../media/${{ steps.cfg.outputs.week }}"

      # With mediaHost "github" the images ARE the CDN, so they must be pushed
      # before Buffer is told about their URLs.
      - name: Commit rendered images
        if: steps.cfg.outputs.skip != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "media/${{ steps.cfg.outputs.week }}"
          git diff --cached --quiet || git commit -m "Render ${{ steps.cfg.outputs.week }}"
          git push

      - name: Schedule in Buffer
        if: steps.cfg.outputs.skip != 'true'
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          AZURE_ACCOUNT: ${{ secrets.AZURE_ACCOUNT }}
          AZURE_CONTAINER: ${{ secrets.AZURE_CONTAINER }}
          AZURE_SAS: ${{ secrets.AZURE_SAS }}
        run: |
          python3 scripts/publish.py \
            --week "${{ steps.cfg.outputs.week }}" \
            --start "${{ steps.cfg.outputs.start }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            ${{ github.event.inputs.force  == 'true' && '--force'   || '' }}

      - name: Commit the scheduling receipt
        if: steps.cfg.outputs.skip != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          RECEIPT="content/${{ steps.cfg.outputs.week }}/SCHEDULED.json"
          if [ -f "$RECEIPT" ]; then
            git add "$RECEIPT"
            git commit -m "Scheduled ${{ steps.cfg.outputs.week }}" || exit 0
            git push
          fi
